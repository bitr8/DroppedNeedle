name: Fork Develop

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install Ruff
        run: pip install ruff==0.6.9
      - name: Run Ruff
        run: ruff check backend

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, format, typecheck
        run: pnpm run check:ci

  build_develop:
    name: Build & Push
    if: github.event_name == 'push'
    needs: [backend-lint, backend-test, frontend-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Skip if superseded
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${GITHUB_REF#refs/heads/}"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha 2>/dev/null || echo "")
          if [ -n "$latest" ] && [ "$latest" != "$GITHUB_SHA" ]; then
            echo "Superseded by ${latest:0:7}, skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space
        if: steps.skip.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghcrunner /usr/local/lib/android /usr/share/swift
      - name: Checkout
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4
      - name: Log in to ghcr.io
        if: steps.skip.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Get short SHA
        if: steps.skip.outputs.skip != 'true'
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Get build date
        if: steps.skip.outputs.skip != 'true'
        id: date
        run: echo "timestamp=$(git log -1 --pretty=%cI)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_TAG=develop-${{ steps.sha.outputs.short }}
            BUILD_DATE=${{ steps.date.outputs.timestamp }}
          tags: |
            ghcr.io/bitr8/droppedneedle:develop
            ghcr.io/bitr8/droppedneedle:develop-${{ steps.sha.outputs.short }}
